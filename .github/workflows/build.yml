name: Build Next Branch Release

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 代码迁出
        uses: actions/checkout@v4

      - name: 2. 构建 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 3. 自动生成临时签名文件 
        run: |
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias myalias -storepass mypassword -keypass mypassword -dname "CN=MyTV, OU=MyTV, O=MyTV, L=Unknown, ST=Unknown, C=Unknown"

      - name: 4. 仅编译 TV 端 APK (核心修改：绕过报错的 Mobile 模块)
        # 将 ./gradlew assembleRelease 改为了 ./gradlew :tv:assembleRelease
        run: chmod +x ./gradlew && ./gradlew :tv:assembleRelease
        env:
          KEYSTORE_PASSWORD: mypassword
          KEY_ALIAS: myalias
          KEY_PASSWORD: mypassword

      - name: 5. 动态提取并重命名应用包
        run: |
          # 动态捕获刚刚生成的 TV 端 apk
          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "成功找到 APK 文件: $APK_PATH"
            mv "$APK_PATH" "mytv-android-next-custom-ua.apk"
          else
            echo "错误：未能找到编译生成的 APK 文件！"
            exit 1
          fi

      - name: 6. 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: mytv-next-custom-release
          path: mytv-android-next-custom-ua.apk
          retention-days: 7
