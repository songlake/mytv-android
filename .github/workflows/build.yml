name: Build Next Branch Release

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 代码迁出
        uses: actions/checkout@v4

      - name: 2. 构建 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle" # 开启缓存，加速编译

      - name: 3. 自动生成临时签名文件
        # 创建 app 目录以防万一，并将 jks 放在默认位置
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias myalias -storepass mypassword -keypass mypassword -dname "CN=MyTV, OU=MyTV, O=MyTV, L=Unknown, ST=Unknown, C=Unknown"

      - name: 4. 生成 Release APK
        # 核心编译命令，Gradle 会自动处理 core/data 等多模块架构
        run: chmod +x ./gradlew && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: mypassword
          KEY_ALIAS: myalias
          KEY_PASSWORD: mypassword

      - name: 5. 动态提取并重命名应用包 (多模块架构适配)
        run: |
          # 全局搜索寻找生成的 release.apk，避免由于模块重构导致路径或名字找不到
          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "成功找到 APK 文件: $APK_PATH"
            mv "$APK_PATH" "mytv-android-next-custom-ua.apk"
          else
            echo "错误：未能找到编译生成的 APK 文件！"
            exit 1
          fi

      - name: 6. 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: mytv-next-custom-release
          path: mytv-android-next-custom-ua.apk
          retention-days: 7
