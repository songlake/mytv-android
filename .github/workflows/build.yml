name: Build Next Branch Release

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 代码迁出
        uses: actions/checkout@v4

      - name: 2. 构建 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 3. 自动生成临时签名文件
        run: |
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias myalias -storepass mypassword -keypass mypassword -dname "CN=MyTV, OU=MyTV, O=MyTV, L=Unknown, ST=Unknown, C=Unknown"

      - name: 4. 强行修复 Bug 与降级内核 (高阶魔法)
        run: |
          # 1. 强删导致编译报错的新版实验性代码
          sed -i '/skipMultipleFramesOnSameVsync/d' tv/src/main/java/top/yogiczy/mytv/tv/ui/screens/videoplayer/player/Media3VideoPlayer.kt
          
          # 2. 动态替换 TOML 配置文件，将 media3 强制降级为 1.3.1 (同时兼容匹配 1.4.0 和 1.5.0)
          sed -i 's/media3 = "1.4.0"/media3 = "1.3.1"/g' gradle/libs.versions.toml
          sed -i 's/media3 = "1.5.0"/media3 = "1.3.1"/g' gradle/libs.versions.toml
 
      - name: 5. 仅编译 TV 端 APK
        run: chmod +x ./gradlew && ./gradlew :tv:assembleRelease
        env:
          KEYSTORE_PASSWORD: mypassword
          KEY_ALIAS: myalias
          KEY_PASSWORD: mypassword

      - name: 6. 动态提取并重命名应用包
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "成功找到 APK 文件: $APK_PATH"
            mv "$APK_PATH" "mytv-android-next-custom-ua.apk"
          else
            echo "错误：未能找到编译生成的 APK 文件！"
            exit 1
          fi

      - name: 7. 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: mytv-next-custom-release
          path: mytv-android-next-custom-ua.apk
          retention-days: 7
